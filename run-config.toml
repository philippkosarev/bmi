bin = "bmi"
build-dir = "build"
manifest = "io.github.philippkosarev.bmi.json"

clean = "rm -rf {build-dir}"

[targets]
native = [
  "{clean}",
  "meson setup {build-dir} --prefix=~/.local",
  "meson compile -C {build-dir}",
  "meson install -C {build-dir}",
  "[{bin}]",
  "ninja uninstall -C {build-dir}",
  "{clean}",
]

flatpak = [
  "{clean}",
  "flatpak-builder {build-dir} {manifest}",
  "[flatpak-builder --run {build-dir} {manifest} {bin}]",
  "{clean}",
]

update-translations = [
  "{clean}",
  "meson setup {build-dir}",
  "meson compile -C {build-dir} {bin}-pot",
  "meson compile -C {build-dir} {bin}-update-po",
  "{clean}",
]
