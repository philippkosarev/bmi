id: io.github.philippkosarev.bmi
command: bmi

runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk

finish-args:
- --socket=wayland
- --socket=fallback-x11
- --device=dri
- --share=ipc

cleanup:
- /include
- /lib/pkgconfig
- /man
- /share/doc
- /share/gtk-doc
- /share/man
- /share/pkgconfig
- '*.la'
- '*.a'

modules:
- name: bmi
  builddir: true
  buildsystem: meson
  sources:
  - type: git
    url: https://github.com/philippkosarev/bmi
    tag: "v4.1"
