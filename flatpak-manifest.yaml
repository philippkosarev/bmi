id: io.github.philippkosarev.bmi
command: bmi

runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

finish-args:
- --socket=wayland
- --socket=fallback-x11
- --device=dri
- --share=ipc

cleanup:
- /include
- /lib/pkgconfig
- /man
- /share/doc
- /share/gtk-doc
- /share/man
- /share/pkgconfig
- '*.la'
- '*.a'

modules:
- name: bmi
  buildsystem: meson
  builddir: true
  config-opts:
    - --buildtype=debug
  sources:
  - type: dir
    path: ./
